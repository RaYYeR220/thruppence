<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Thruppence</title>
    <style>
      :root { --bg: #232323; --fg: #e5e5e5; --muted: #9a9a9a; --line: rgba(229, 229, 229, 0.1); --accent: #fef991; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
      #app { max-width: 520px; margin: 0 auto; padding: 18px 20px 40px; box-sizing: border-box; }
      header { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding-bottom: 14px; border-bottom: 1px solid var(--line); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #5a5a5a; display: inline-block; }
      .dot.on { background: var(--accent); }
      h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 26px 0 8px; }
      h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 26px 0 8px; }
      p { margin: 0 0 16px; color: #cfcfcf; }
      .muted { color: var(--muted); }
      .small { font-size: 13px; }
      code { background: rgba(255, 255, 255, 0.06); padding: 2px 6px; border-radius: 4px; }
      .primary { display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 14px 16px; border: 0; border-radius: 12px;
        background: var(--accent); color: #1a1a1a; font: 600 16px/1 inherit; text-decoration: none; margin: 8px 0 14px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 12px; margin: 14px 0; }
      .stats div { padding: 12px; border-left: 1px solid var(--line); }
      .stats div:first-child { border-left: 0; }
      .stats b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
      .stats span { font-size: 12px; color: var(--muted); }
      .hint { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
      .hist { list-style: none; margin: 0; padding: 0; }
      .hist li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
      .amt { font-variant-numeric: tabular-nums; color: var(--muted); }
      .amt.paid { color: var(--fg); }
      .amt.declined { text-decoration: line-through; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
